apiVersion: apps/v1
kind: Deployment

metadata:
  name: sre-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-app

  template:
    metadata:
      labels:
        app: sre-app

    spec:
      containers:
      - name: sre-app
        image: nginx:latest

        ports:
        - containerPort: 80

        livenessProbe:
          httpGet:
            path: /
            port: 80

         readinessProbe:
           httpGet:
             path: /
             port: 80